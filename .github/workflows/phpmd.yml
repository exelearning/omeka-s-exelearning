name: PHPMD

on:
  push:
    paths-ignore:
      - '.agents/skills/**'
      - '.claude/skills/**'
    branches: [ "main" ]
  pull_request:
    paths-ignore:
      - '.agents/skills/**'
      - '.claude/skills/**'
    branches: [ "main" ]
  schedule:
    - cron: '35 8 * * 5'

permissions:
  contents: read

jobs:
  PHPMD:
    name: Run PHPMD scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          # PHPMD 3 needs PHP 8.1+; without php-version, setup-php picks the 7.4 floor from composer.json
          php-version: '8.1'
          tools: phpmd:3.0.0

      - name: Run PHPMD
        run: phpmd analyze . --format sarif --ruleset phpmd.xml --reportfile-sarif phpmd-results.sarif --ignore-violations-on-exit --no-progress
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: phpmd-results.sarif
          wait-for-processing: true
